<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avocado Toast</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Lato:300,400,900");

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #333333;
        font: 16px "Lato", sans-serif;
        color: #ffffff;
      }

      .recipe-card {
        position: relative;
        width: min(983px, calc(100vw - 32px));
        height: 533px;
        margin: 75px auto 0;
        border-radius: 12px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(44, 58, 42, 0.72) 0%, rgba(28, 42, 51, 0.7) 45%, rgba(36, 54, 66, 0.7) 100%),
          url("https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=1200&q=80") center / cover no-repeat;
      }

      .info {
        position: absolute;
        top: 45px;
        left: 118px;
        font-size: 13px;
        white-space: nowrap;
      }

      .info span { margin-right: 25px; }
      .info strong { font-weight: 900; color: #b5c640; }

      .btn {
        position: absolute;
        top: 81px;
        left: 252px;
        padding: 7px 20px;
        font: 400 13px Arial, sans-serif;
        color: #ffffff;
        text-decoration: none;
        border: 2px solid #ffffff;
        border-radius: 20px;
        transition: background-color .3s, border-color .3s;
      }

      .btn:hover {
        background: #b5c640;
        border-color: #b5c640;
      }

      h1 {
        position: absolute;
        top: 42px;
        left: 388px;
        margin: 0;
        font-size: 48px;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .steps {
        position: absolute;
        top: 124px;
        left: 399px;
        width: min(530px, calc(100% - 440px));
      }

      .steps p {
        margin: 0 0 22px;
        font-size: 12px;
        font-weight: 300;
        line-height: 1.25;
      }

      @media (max-width: 760px) {
        .recipe-card {
          width: min(90vw, 700px);
          height: auto;
          min-height: 500px;
          padding: 32px 22px 24px;
        }

        .info,
        .btn,
        h1,
        .steps {
          position: static;
          display: block;
        }

        .info {
          margin-bottom: 18px;
          white-space: normal;
        }

        .btn {
          width: fit-content;
          margin: 0 0 18px;
        }

        h1 {
          margin-bottom: 18px;
          font-size: clamp(2rem, 7vw, 3rem);
          white-space: normal;
        }

        .steps {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <article class="recipe-card">
      <div class="info">
        <span><strong>25</strong> min</span>
        <span><strong>3</strong> ingredients</span>
        <span><strong>1</strong> serving</span>
      </div>

      <a class="btn" href="#">Get recipe</a>

      <h1>Avocado Toast</h1>

      <div class="steps">
        <p>Toast the sourdough until deeply golden and crisp.</p>
        <p>Smash ripe avocado with salt, lemon juice, and a pinch of chili flakes.</p>
        <p>Spread generously over the toast, then top with radish, herbs, and a drizzle of olive oil.</p>
      </div>
    </article>
  </body>
</html>
